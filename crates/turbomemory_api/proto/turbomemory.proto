syntax = "proto3";

package turbomemory;

service Memory {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc Insert (InsertRequest) returns (InsertResponse);
  rpc InsertBatch (InsertBatchRequest) returns (InsertBatchResponse);
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc SearchAnn (SearchAnnRequest) returns (SearchResponse);
  rpc StepSession (StepSessionRequest) returns (StepSessionResponse);
  rpc TriggerConsolidation (TriggerConsolidationRequest) returns (TriggerConsolidationResponse);
  rpc Flush (FlushRequest) returns (FlushResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message InsertRequest {
  string id = 1;
  string text = 2;
  repeated float embedding = 3;
  float importance = 4;
  repeated string concepts = 5;
}

message InsertResponse {
  bool success = 1;
}

message InsertBatchRequest {
  repeated string ids = 1;
  repeated string texts = 2;
  repeated Embedding embeddings = 3;
  repeated float scores = 4;
  repeated StringList concepts = 5;
}

message Embedding {
  repeated float values = 1;
}

message StringList {
  repeated string values = 1;
}

message InsertBatchResponse {
  uint32 count = 1;
}

message SearchRequest {
  string query_text = 1;
  repeated float query_embedding = 2;
  uint32 top_k = 3;
}

message SearchAnnRequest {
  repeated float query_embedding = 1;
  uint32 top_k = 2;
}

message SearchResponse {
  repeated ScoredMemory results = 1;
  bool gated = 2;
}

message ScoredMemory {
  string id = 1;
  float score = 2;
}

message StepSessionRequest {
  string user_input = 1;
  string assistant_response = 2;
}

message StepSessionResponse {
  string ccs_json = 1;
}

message TriggerConsolidationRequest {}

message TriggerConsolidationResponse {
  uint32 sealed = 1;
  uint32 compacted = 2;
}

message FlushRequest {}

message FlushResponse {
  bool success = 1;
}
