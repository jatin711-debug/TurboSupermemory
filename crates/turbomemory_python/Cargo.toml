[package]
name = "turbomemory_python"
version = "0.1.0"
edition = "2021"

[lib]
name = "turbomemory"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["turbomemory_storage/cuda"]

[dependencies]
turbomemory_core = { path = "../turbomemory_core" }
turbomemory_storage = { path = "../turbomemory_storage" }
turbomemory_graph = { path = "../turbomemory_graph" }
pyo3 = { workspace = true }
numpy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
parking_lot = { workspace = true }
