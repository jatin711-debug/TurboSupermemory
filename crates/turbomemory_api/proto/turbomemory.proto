syntax = "proto3";

package turbomemory;

service Memory {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc Insert (InsertRequest) returns (InsertResponse);
  rpc InsertBatch (InsertBatchRequest) returns (InsertBatchResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Update (UpdateRequest) returns (UpdateResponse);
  rpc GetPayload (GetPayloadRequest) returns (GetPayloadResponse);
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc SearchAnn (SearchAnnRequest) returns (SearchResponse);
  rpc StepSession (StepSessionRequest) returns (StepSessionResponse);
  rpc TriggerConsolidation (TriggerConsolidationRequest) returns (TriggerConsolidationResponse);
  rpc Flush (FlushRequest) returns (FlushResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message InsertRequest {
  string id = 1;
  string text = 2;
  repeated float embedding = 3;
  float importance = 4;
  repeated string concepts = 5;
  optional string payload = 6;
  optional string scope = 7;
}

message InsertResponse {
  bool success = 1;
}

message InsertBatchRequest {
  repeated string ids = 1;
  repeated string texts = 2;
  repeated Embedding embeddings = 3;
  repeated float scores = 4;
  repeated StringList concepts = 5;
  repeated string payloads = 6;
  repeated string scopes = 7;
}

message Embedding {
  repeated float values = 1;
}

message StringList {
  repeated string values = 1;
}

message InsertBatchResponse {
  uint32 count = 1;
}

message DeleteRequest {
  string id = 1;
}

message DeleteResponse {
  bool success = 1;
}

message UpdateRequest {
  string id = 1;
  string text = 2;
  repeated float embedding = 3;
  float importance = 4;
  repeated string concepts = 5;
  optional string payload = 6;
  optional string scope = 7;
}

message UpdateResponse {
  bool success = 1;
}

message GetPayloadRequest {
  string id = 1;
}

message GetPayloadResponse {
  bool found = 1;
  string payload = 2;
}

message Filter {
  oneof kind {
    EqFilter eq = 1;
    RangeFilter range = 2;
    FullTextFilter full_text = 3;
    FilterList and = 4;
    FilterList or = 5;
    Filter not = 6;
  }
}

message EqFilter {
  string field = 1;
  string value_json = 2;
}

message RangeFilter {
  string field = 1;
  optional double low = 2;
  optional double high = 3;
  bool low_inclusive = 4;
  bool high_inclusive = 5;
}

message FullTextFilter {
  string field = 1;
  string query = 2;
}

message FilterList {
  repeated Filter filters = 1;
}

message SearchRequest {
  string query_text = 1;
  repeated float query_embedding = 2;
  uint32 top_k = 3;
  optional Filter filter = 4;
  optional string scope = 5;
}

message SearchAnnRequest {
  repeated float query_embedding = 1;
  uint32 top_k = 2;
  optional Filter filter = 3;
  optional string scope = 4;
}

message SearchResponse {
  repeated ScoredMemory results = 1;
  bool gated = 2;
}

message ScoredMemory {
  string id = 1;
  float score = 2;
  optional string payload = 3;
}

message StepSessionRequest {
  string user_input = 1;
  string assistant_response = 2;
}

message StepSessionResponse {
  string ccs_json = 1;
}

message TriggerConsolidationRequest {}

message TriggerConsolidationResponse {
  uint32 sealed = 1;
  uint32 compacted = 2;
}

message FlushRequest {}

message FlushResponse {
  bool success = 1;
}
