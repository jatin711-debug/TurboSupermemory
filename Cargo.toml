[workspace]
members = [
    "crates/turbomemory_core",
    "crates/turbomemory_storage",
    "crates/turbomemory_graph",
    "crates/turbomemory_python",
    "crates/turbomemory_api",
    "crates/turbomemory_gpu",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
crc32fast = "1.4"
arc-swap = "1.7"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
ndarray = "0.15"
memmap2 = "0.9"
byteorder = "1.5"
ahash = "0.8"
smallvec = "1.13"
bytemuck = "1.18"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.38", features = ["full"] }
tempfile = "3.10"
redb = "4.1"
usearch = "2.25"
roaring = "0.10"
ordered-float = "4.0"
tantivy = "0.22"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py312"] }
numpy = "0.25"
tonic = "0.12"
prost = "0.13"
axum = "0.7"
# GPU support
cudarc = { version = "0.19", features = ["cuda-12080", "nvrtc", "cublas", "cusparse"] }
fastrand = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
