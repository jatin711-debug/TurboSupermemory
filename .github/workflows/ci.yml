# Linux only, and only what needs no datasets, models, keys or GPU:
# formatting, lints, the Rust suite, and the tsm SDK unit suite against a
# freshly built extension.
#
# `make gate`, run locally, stays the merge gate for engine and
# cognitive-layer changes: it adds the evaluation smoke tests (LongMemEval
# data and a cached embedding model). Windows is covered by that local gate.
# macOS, the AArch64 NEON kernels and the CUDA build are not covered here.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: fmt + clippy + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # PyO3 (abi3-py312) needs a 3.12 interpreter to configure its build,
      # also for clippy over the whole workspace.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install protoc (tonic-build compiles the proto)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --exclude turbomemory_python --locked
      - name: Build the Python extension
        run: |
          cargo build -p turbomemory_python --locked
          cp target/debug/libturbomemory.so turbomemory.so
      - name: SDK unit tests
        run: |
          python -m pip install --quiet numpy
          python -m unittest discover -s tsm/tests -t .
