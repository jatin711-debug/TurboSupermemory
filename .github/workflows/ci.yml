# The checks that need no datasets, models, keys or GPU: formatting, lints,
# the Rust suite, and the tsm SDK unit suite against a freshly built
# extension. `make gate` adds the evaluation smoke tests (LongMemEval data and
# a cached embedding model) and stays the local merge gate for engine and
# cognitive-layer changes; the CUDA build is tested locally as well.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Windows runs out of PDB room linking the storage tests with debug info
  # (LNK1102); nothing here reads it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runners are ARM: the only place the NEON kernels are compiled and
    # run. That job passed on the workflow's first run; it reports without
    # blocking until it has a track record.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        experimental: [false]
        include:
          - os: macos-latest
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protoc
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler ;;
            macOS)   brew install protobuf ;;
            Windows) choco install protoc -y --no-progress ;;
          esac
          protoc --version
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace --exclude turbomemory_python --locked
      - name: Build the Python extension
        run: |
          cargo build -p turbomemory_python --locked
          case "$RUNNER_OS" in
            Linux)   cp target/debug/libturbomemory.so turbomemory.so ;;
            macOS)   cp target/debug/libturbomemory.dylib turbomemory.so ;;
            Windows) cp target/debug/turbomemory.dll turbomemory.pyd ;;
          esac
      - name: SDK unit tests
        run: |
          python -m pip install --quiet numpy
          python -m unittest discover -s tsm/tests -t .
